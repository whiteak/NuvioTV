name: Build Requiem for TV (on Prism)

# Manual only. Requiem for the TV is the full Prism TV app (whiteak/prism tv/) built on this repo's dev branch,
# named Requiem with Requiem's pictures (editions/requiem/tv-on-prism.sh). It keeps Requiem's app ID and signing
# key and is published as Requiem-TV-<version>.apk on a new release here, so the Requiem already on the TV
# updates to it in the app. The Ethereal TV app only installs Ethereal-* files, so it is not rebuilt.

on:
  workflow_dispatch:
    inputs:
      prism_ref:
        description: whiteak/prism branch or commit to build from
        default: main

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build Requiem TV (Prism inside)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Check out Prism
        uses: actions/checkout@v4
        with:
          repository: whiteak/prism
          ref: ${{ inputs.prism_ref }}
          path: .prism
      - name: Pick the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::The SIGNING_KEYSTORE secret is missing."; exit 1; }
          base=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          base_code=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts | head -1)
          tags=$(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name')
          last=$(printf '%s\n' "$tags" | sed -n "s/^v$(printf '%s' "$base" | sed 's/[.]/\\./g')\\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          echo "version=$base.$n" >> "$GITHUB_OUTPUT"
          echo "code=$(( base_code * 1000 + n ))" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Building Requiem TV $base.$n"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Turn the app into Requiem (Prism inside)
        env:
          VERSION: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          sed -i "s/^\( *versionName = \)\".*\"/\1\"$VERSION\"/; s/^\( *versionCode = \)[0-9][0-9]*$/\1$VERSION_CODE/" app/build.gradle.kts
          grep -q "versionName = \"$VERSION\"" app/build.gradle.kts
          bash .prism/tv/apply.sh "$PWD"
          bash editions/requiem/tv-on-prism.sh "$PWD"
      - name: Build
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          KEY_ALIAS: ethereal
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          touch local.properties local.dev.properties
          printf 'TRAKT_CLIENT_ID=%s\nTRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_ID" "$TRAKT_CLIENT_SECRET" >> local.properties
          NUVIO_RELEASE_STORE_FILE="$RUNNER_TEMP/signing.jks" NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS \
          NUVIO_RELEASE_KEY_PASSWORD="$KEY_PASSWORD" NUVIO_RELEASE_STORE_PASSWORD="$KEY_PASSWORD" \
            ./gradlew :app:assembleFullDebug --stacktrace
          cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk "$RUNNER_TEMP/Requiem-TV-$VERSION.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          BASE: ${{ steps.v.outputs.base }}
        run: |
          {
            printf 'Requiem for the TV %s, built on Nuvio %s, now with everything from Prism:\n' "$VERSION" "$BASE"
            printf 'Settings > Appearance to customise, or copy the set-up from Requiem on the phone over the home Wi-Fi.\n\n'
            printf 'Only Requiem-TV-%s.apk is in this one; Ethereal stays on its last release.\n\n' "$VERSION"
            printf 'Built from commit %s\n' "$(git rev-parse HEAD)"
          } > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          for i in 1 2 3 4; do
            gh release create "v$VERSION" "$RUNNER_TEMP/Requiem-TV-$VERSION.apk" --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" --title "Requiem TV $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $prerelease && break
            [ "$i" = 4 ] && exit 1
            sleep $((i * 5))
          done
          # Keep only the newest 2 releases (tags stay, so numbering never goes backwards).
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' |
            grep '^v' | tail -n +3 | while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes || true; done
