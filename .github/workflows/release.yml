name: Sync and release Ethereal and Requiem

# Weekly: merge the latest upstream Nuvio code into this fork (keeping the Ethereal and Requiem
# customisations), then build and publish a release that the in-app updater picks up.
# Also runs on pushes to the default branch. Each release gets the next build number.

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: Publish a new release even if nothing changed (for testing the in-app updater)
        type: boolean
        default: false
  push:
    branches: [dev]

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: NuvioMedia/NuvioTV
  BRANCH: dev

jobs:
  sync:
    name: Merge upstream Nuvio
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ethereal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${BRANCH}"

          if git merge-base --is-ancestor "upstream/${BRANCH}" HEAD; then
            echo "Already up to date with ${UPSTREAM_REPO}."
            exit 0
          fi

          git merge --no-commit --no-ff "upstream/${BRANCH}" || true

          # Keep this fork's own workflows exactly as they are (upstream CI and bots stay removed).
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows
          git add -A .github/workflows

          # Keep Ethereal and Requiem branding images when upstream changed the same files.
          unresolved=""
          for f in $(git diff --name-only --diff-filter=U); do
            case "$f" in
              *.png|*.webp|*.jpg|*.jpeg)
                if git cat-file -e "HEAD:$f" 2>/dev/null; then
                  git checkout HEAD -- "$f"
                  git add "$f"
                else
                  git rm -q "$f"
                fi ;;
              *) unresolved="$unresolved $f" ;;
            esac
          done

          if [ -n "$unresolved" ]; then
            git merge --abort
            body=$(printf 'The weekly sync with %s conflicts with Ethereal changes in:\n\n%s\n\nNothing was changed. Ask Claude to resolve it.' "$UPSTREAM_REPO" "$unresolved")
            gh issue create --title "Ethereal: upstream sync needs attention" --body "$body" || true
            echo "::error::Merge conflicts in:${unresolved}"
            exit 1
          fi

          git commit -m "Sync with upstream ${UPSTREAM_REPO}"
          git push origin "HEAD:${BRANCH}"

  release:
    name: Build and publish Ethereal
    needs: sync
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Read app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          base=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          base_code=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$base" ] || [ -z "$base_code" ]; then echo "::error::Could not read app version"; exit 1; fi
          # Every Ethereal release gets its own number on top of the Nuvio version (1.1.0-beta.5.1,
          # 1.1.0-beta.5.2, ...; 1.2.0.1 for a stable Nuvio version), so the in-app updater always sees the newest build as newer.
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          last=$(printf '%s\n' "$tags" | sed -n "s/^v$(printf '%s' "$base" | sed 's/[.]/\\./g')\\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          if [ -n "$last" ]; then
            built_sha=$(gh release view "v$base.$last" --json body --jq .body | sed -n 's/^Built from commit //p' | head -1)
            if [ "$built_sha" = "$(git rev-parse HEAD)" ] && [ "$FORCE" != "true" ]; then
              echo "Release v$base.$last already has this commit; nothing to publish."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          n=$(( ${last:-0} + 1 ))
          echo "version=$base.$n" >> "$GITHUB_OUTPUT"
          echo "code=$(( base_code * 1000 + n ))" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Publishing Ethereal $base.$n"

      - name: Check signing key
        if: steps.version.outputs.skip == 'false'
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE || secrets.REELROOM_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.REELROOM_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEYSTORE && 'ethereal' || 'reelroom' }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add the SIGNING_KEYSTORE and SIGNING_KEY_PASSWORD secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build
        if: steps.version.outputs.skip == 'false'
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE || secrets.REELROOM_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.REELROOM_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEYSTORE && 'ethereal' || 'reelroom' }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          sed -i "s/^\( *versionName = \)\".*\"/\1\"$VERSION\"/; s/^\( *versionCode = \)[0-9][0-9]*$/\1$VERSION_CODE/" app/build.gradle.kts
          grep -q "versionName = \"$VERSION\"" app/build.gradle.kts
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          touch local.properties local.dev.properties
          NUVIO_RELEASE_STORE_FILE="$RUNNER_TEMP/signing.jks" NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS \
          NUVIO_RELEASE_KEY_PASSWORD="$KEY_PASSWORD" NUVIO_RELEASE_STORE_PASSWORD="$KEY_PASSWORD" \
            ./gradlew :app:assembleFullDebug --stacktrace
          cp "app/build/outputs/apk/full/debug/app-full-universal-debug.apk" "$RUNNER_TEMP/Ethereal.apk"
          # Requiem: the same app with its own name, artwork and app ID, so it installs alongside.
          bash editions/requiem/apply.sh
          NUVIO_RELEASE_STORE_FILE="$RUNNER_TEMP/signing.jks" NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS \
          NUVIO_RELEASE_KEY_PASSWORD="$KEY_PASSWORD" NUVIO_RELEASE_STORE_PASSWORD="$KEY_PASSWORD" \
            ./gradlew :app:assembleFullDebug --stacktrace
          cp "app/build/outputs/apk/full/debug/app-full-universal-debug.apk" "$RUNNER_TEMP/Requiem.apk"
          git checkout -- . && git clean -fdq -e local.properties -e local.dev.properties

      - name: Publish release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          cp "$RUNNER_TEMP/Ethereal.apk" "Ethereal-TV-${VERSION}.apk"
          cp "$RUNNER_TEMP/Requiem.apk" "Requiem-TV-${VERSION}.apk"
          # Release notes: Nuvio's own notes for the version this build is based on, then this build's details.
          upstream_notes=""
          releases=$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=50" 2>/dev/null || echo '[]')
          echo "Recent Nuvio releases: $(printf '%s' "$releases" | jq -r '[.[:5][] | .tag_name] | join(", ")')"
          # Match the version as a whole number anywhere in the tag or title (v0.5.10, mobile-0.5.10, "Nuvio 0.5.10").
          pattern="(^|[^0-9.])$(printf '%s' "$BASE" | sed 's/[.]/\\./g')([^0-9.]|$)"
          upstream_notes=$(printf '%s' "$releases" | jq -r --arg p "$pattern" '[.[] | select(((.tag_name // "") + " " + (.name // "")) | test($p))][0].body // ""')
          if [ -n "$upstream_notes" ]; then echo "Using Nuvio ${BASE} release notes."; else echo "No Nuvio release notes found for ${BASE}."; fi
          {
            if [ -n "$upstream_notes" ]; then printf '%s\n\n---\n\n' "$upstream_notes"; fi
            printf 'Ethereal %s, built on Nuvio %s.\n\nEthereal-* is Ethereal; Requiem-* is the Requiem edition.\n\nBuilt from commit %s\n' "$VERSION" "$BASE" "$(git rev-parse HEAD)"
          } > "$RUNNER_TEMP/notes.md"
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v${VERSION}" "Ethereal-TV-${VERSION}.apk" "Requiem-TV-${VERSION}.apk" \
            --target "$(git rev-parse HEAD)" \
            --title "Ethereal ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $prerelease
